apiVersion: apps/v1
kind: Deployment
metadata:
  name: vision-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vision-inference
  template:
    metadata:
      labels:
        app: vision-inference
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/REPLACE_ORG/vision-transfer-learning:REPLACE_TAG
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/artifacts/smoke_resnet18.pt
          volumeMounts:
            - name: model
              mountPath: /app/artifacts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: vision-model-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: vision-inference
spec:
  selector:
    app: vision-inference
  ports:
    - name: http
      port: 80
      targetPort: 8000
