apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vision-inference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vision-inference
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vision-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vision-inference
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
