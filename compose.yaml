services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    image: project03-vision-inference:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PATH: /app/artifacts/smoke_resnet18.pt
    volumes:
      - ./artifacts:/app/artifacts:ro
    init: true
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    restart: "no"
# For educational use only. Generate artifacts/smoke_resnet18.pt first.
# The API is not authenticated; bind only to localhost.
